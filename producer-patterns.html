<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共創で事業を起こすパターン｜social R&D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1A1A1A;--sub:#6B7280;--mute:#9CA3AF;--line:#E5E7EB;--bg:#F8F7F4;--acc:#5B6B12;--acc-soft:#EEF1DC;--warn:#92400E;--warn-soft:#FEF3C7}
body{background:var(--bg);font-family:'Helvetica Neue','Noto Sans JP',sans-serif;color:var(--ink);padding:32px 16px 64px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto}
a{color:inherit}
.back{font-size:12px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--ink)}
header{margin:20px 0 24px}
h1{font-size:22px;font-weight:800;line-height:1.45;margin-bottom:6px}
.lead{font-size:13px;color:var(--sub)}
.note{margin-top:14px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.7}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:24px 0 16px}
.tab{background:none;border:none;font:inherit;font-size:14px;font-weight:700;color:var(--mute);padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--sub)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.search{flex:1 1 200px;min-width:160px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;background:#fff}
.count{font-size:12px;color:var(--mute);margin-bottom:10px}
h2.cat{font-size:13px;font-weight:700;color:var(--acc);margin:26px 0 10px;padding-left:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card>button{all:unset;display:block;width:100%;padding:16px 18px;cursor:pointer;box-sizing:border-box}
.card>button:focus-visible,.chip:focus-visible,.tab:focus-visible,.rel:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.head{display:flex;gap:12px;align-items:baseline}
.pid{font-size:12px;font-weight:700;color:var(--acc);min-width:28px}
.name{font-size:16px;font-weight:700;line-height:1.45}
.summary{font-size:13px;color:var(--sub);margin:4px 0 0 40px}
.force{margin:12px 0 0 40px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:12.5px;line-height:1.55}
.force span{background:var(--acc-soft);border-radius:8px;padding:6px 10px}
.force i{font-style:normal;color:var(--acc);font-weight:700}
.body{display:none;padding:0 18px 18px 58px;font-size:13.5px}
.card.open .body{display:block}
.meta{font-size:11.5px;color:var(--mute);margin-bottom:12px}
.row{margin-top:12px}
.row b{display:block;font-size:12px;color:var(--acc);margin-bottom:2px}
.row.caution{background:#FAFAF6;border-left:3px solid var(--acc);padding:8px 12px;border-radius:0 8px 8px 0}
.row.hypo{background:var(--warn-soft);padding:8px 12px;border-radius:8px}
.row.hypo b{color:var(--warn)}
.ev{list-style:none;margin-top:4px}
.ev li{padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.ev li:first-child{border-top:none}
.ev .loc{display:block;font-size:11.5px;font-weight:700;color:var(--sub)}
.rel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 10px;margin:4px 6px 0 0;font:inherit;font-size:12px;cursor:pointer}
.rel:hover{border-color:var(--acc);color:var(--acc)}
.fw{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;font-size:13.5px}
.fw .kind{font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.empty,.error{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:20px;font-size:13px;color:var(--sub)}
.error code{background:#F3F4F6;padding:1px 6px;border-radius:4px}
footer{margin-top:40px;font-size:11px;color:var(--mute);text-align:center}
@media(max-width:520px){.summary,.force{margin-left:0}.body{padding-left:18px}.force{grid-template-columns:1fr}.force i{text-align:center}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← 一覧に戻る</a>
  <header>
    <h1>共創で事業を起こすパターン</h1>
    <p class="lead" id="lead">読み込み中…</p>
    <div class="note" id="note" hidden></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-p" aria-selected="true">パターン</button>
    <button class="tab" role="tab" id="tab-f" aria-selected="false">フレームワーク</button>
  </div>

  <div id="view-p">
    <div class="tools">
      <div id="chips" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      <input class="search" id="q" type="search" placeholder="本文・根拠まで検索" aria-label="パターンを検索">
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>
  <div id="view-f" hidden><div id="fwlist"></div></div>

  <footer>未検証の草案です。現場で使って「うちだとこうだった」を書き戻してください。</footer>
</div>

<script>
const SRC = './new-business-seeds-patterns.json';
const state = { data:null, cat:'all', q:'' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortId = id => id.replace(/^nb-/, '');

function nameOf(id){
  const d = state.data;
  const hit = d.patterns.find(p => p.id === id) || d.frameworks.find(f => f.id === id);
  return hit ? hit.name : id;
}

function renderChips(){
  const d = state.data;
  const items = [{id:'all', name:'すべて'}].concat(d.categories);
  $('chips').innerHTML = items.map(c => {
    const n = c.id === 'all' ? d.patterns.length : d.patterns.filter(p => p.category === c.id).length;
    return `<button class="chip" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${esc(c.name)}（${n}）</button>`;
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; renderChips(); renderList(); });
}

function cardHTML(p){
  const rows = [
    ['状況', p.context], ['問題', p.problem], ['解決', p.solution], ['結果', p.result]
  ].map(([k,v]) => `<div class="row"><b>${k}</b>${esc(v)}</div>`).join('');
  const caution = p.caution ? `<div class="row caution"><b>使うときの注意</b>${esc(p.caution)}</div>` : '';
  const social = p.social ? `<div class="row"><b>原典からの翻訳</b>${esc(p.social)}</div>` : '';
  const hypo = p.hypothesis ? `<div class="row hypo"><b>仮説</b>${esc(p.hypothesis)}</div>` : '';
  const ev = `<div class="row"><b>根拠（要旨・原文は出所のページで確認）</b><ul class="ev">${
    p.evidence.map(e => `<li><span class="loc">${esc(e.loc)}</span>${esc(e.gist)}</li>`).join('')}</ul></div>`;
  const rel = p.related.length ? `<div class="row"><b>関連</b>${
    p.related.map(r => `<button class="rel" data-go="${r}">${esc(shortId(r))} ${esc(nameOf(r))}</button>`).join('')}</div>` : '';
  return `<div class="card" id="${p.id}">
    <button aria-expanded="false">
      <div class="head"><span class="pid">${esc(shortId(p.id))}</span><span class="name">${esc(p.name)}</span></div>
      <p class="summary">${esc(p.summary)}</p>
      <div class="force"><span>${esc(p.tension.a)}</span><i>⇔</i><span>${esc(p.tension.b)}</span></div>
    </button>
    <div class="body">
      <div class="meta">性質：${esc(p.form)}／持ち込み方：${esc(p.transfer)}／束ねた素材：${p.merged_from.map(m => '#' + m).join(', ')}／検証：${p.verified ? '済' : '未'}／実践報告：${p.jp_cases.length}件</div>
      ${rows}${caution}${social}${hypo}${ev}${rel}
    </div>
  </div>`;
}

function matches(p){
  if (state.cat !== 'all' && p.category !== state.cat) return false;
  if (!state.q) return true;
  return JSON.stringify(p).toLowerCase().includes(state.q.toLowerCase());
}

function renderList(){
  const d = state.data;
  const shown = d.patterns.filter(matches);
  $('count').textContent = `${shown.length}枚を表示`;
  if (!shown.length){ $('list').innerHTML = '<div class="empty">該当するパターンがありません。検索語か分類を変えてください。</div>'; return; }
  $('list').innerHTML = d.categories.map(c => {
    const ps = shown.filter(p => p.category === c.id);
    return ps.length ? `<h2 class="cat">${esc(c.name)}</h2>` + ps.map(cardHTML).join('') : '';
  }).join('');
  $('list').querySelectorAll('.card>button').forEach(b => b.onclick = () => toggle(b.parentElement));
  $('list').querySelectorAll('.rel').forEach(b => b.onclick = () => go(b.dataset.go));
}

function toggle(card, force){
  const open = force ?? !card.classList.contains('open');
  card.classList.toggle('open', open);
  card.querySelector('button').setAttribute('aria-expanded', open);
}

function go(id){
  if (id.startsWith('nb-F')){ showTab('f'); const el = $(id); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  showTab('p');
  if (!$(id)){ state.cat = 'all'; state.q = ''; $('q').value = ''; renderChips(); renderList(); }
  const el = $(id); if (!el) return;
  toggle(el, true); el.scrollIntoView({behavior:'smooth', block:'start'});
  history.replaceState(null, '', '#' + id);
}

function renderFrameworks(){
  $('fwlist').innerHTML = state.data.frameworks.map(f => `<div class="fw" id="${f.id}">
    <div class="head"><span class="pid">${esc(shortId(f.id))}</span><span class="name">${esc(f.name)}<span class="kind">${esc(f.kind)}</span></span></div>
    <div class="row">${esc(f.summary)}</div>
    <div class="row"><b>使いどころ</b>${esc(f.use)}</div>
    <div class="row"><b>根拠（要旨）</b><ul class="ev">${f.evidence.map(e => `<li><span class="loc">${esc(e.loc)}</span>${esc(e.gist)}</li>`).join('')}</ul></div>
  </div>`).join('');
}

function showTab(t){
  $('tab-p').setAttribute('aria-selected', t === 'p');
  $('tab-f').setAttribute('aria-selected', t === 'f');
  $('view-p').hidden = t !== 'p';
  $('view-f').hidden = t !== 'f';
}

async function init(){
  try {
    const res = await fetch(SRC, {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.data = await res.json();
  } catch (e) {
    $('lead').textContent = '';
    $('list').innerHTML = `<div class="error"><b>パターンのデータを読み込めませんでした。</b><br>
      <code>new-business-seeds-patterns.json</code> がこのページと同じ階層にあるか確認してください。<br>
      手元で確認するときは、HTMLをダブルクリックで開かず、フォルダで <code>python3 -m http.server</code> を実行して <code>localhost:8000</code> から開いてください。</div>`;
    return;
  }
  const d = state.data, m = d.meta;
  $('lead').innerHTML = `${esc(m.source_book)}から起こした${d.patterns.length}パターン＋${d.frameworks.length}フレームワーク。主語は${esc(m.subject)}。`;
  $('note').hidden = false;
  $('note').textContent = `${m.status}です。${m.evidence_note}${m.page_note}`;
  $('tab-p').textContent = `パターン（${d.patterns.length}）`;
  $('tab-f').textContent = `フレームワーク（${d.frameworks.length}）`;
  $('tab-p').onclick = () => showTab('p');
  $('tab-f').onclick = () => showTab('f');
  $('q').oninput = e => { state.q = e.target.value.trim(); renderList(); };
  renderChips(); renderList(); renderFrameworks();
  if (location.hash) go(location.hash.slice(1));
  window.addEventListener('hashchange', () => { if (location.hash) go(location.hash.slice(1)); });
}
init();
</script>
</body>
</html>
