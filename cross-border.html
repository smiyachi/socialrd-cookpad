<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴走者のパターン・ランゲージ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #333;
  --text: #e8e4df;
  --text-muted: #999;
  --accent-before: #c9a96e;
  --accent-during: #6ea5c9;
  --accent-after: #7bc96e;
  --accent-cross: #c96eb8;
  --accent-meta: #c96e6e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  line-height: 1.8;
  overflow-x: hidden;
}
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 50%, rgba(201,169,110,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 50%, rgba(110,165,201,0.04) 0%, transparent 50%);
  animation: drift 20s ease-in-out infinite;
}
@keyframes drift {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-3%, 2%); }
}
.hero h1 {
  font-family: 'Noto Serif JP', serif;
  font-weight: 900;
  font-size: clamp(2rem, 5vw, 4rem);
  letter-spacing: 0.15em;
  position: relative;
  z-index: 1;
  background: linear-gradient(135deg, var(--accent-before), var(--text), var(--accent-during));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero .subtitle {
  font-size: clamp(0.9rem, 2vw, 1.2rem);
  color: var(--text-muted);
  margin-top: 1.5rem;
  position: relative;
  z-index: 1;
  max-width: 640px;
  letter-spacing: 0.05em;
}
.hero .count {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(3rem, 8vw, 7rem);
  font-weight: 900;
  color: var(--accent-before);
  opacity: 0.15;
  position: relative;
  z-index: 1;
  margin-top: 2rem;
}
.hero .scroll-hint {
  position: absolute;
  bottom: 2rem;
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.3em;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

.controls {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 1rem 2rem;
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  justify-content: center;
}
.filter-btn {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.4rem 1rem;
  border: 1px solid var(--border);
  border-radius: 2rem;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.05em;
}
.filter-btn:hover { border-color: var(--text); color: var(--text); }
.filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.filter-btn[data-phase="before"].active { background: var(--accent-before); border-color: var(--accent-before); color: var(--bg); }
.filter-btn[data-phase="during"].active { background: var(--accent-during); border-color: var(--accent-during); color: var(--bg); }
.filter-btn[data-phase="after"].active { background: var(--accent-after); border-color: var(--accent-after); color: var(--bg); }
.filter-btn[data-phase="cross"].active { background: var(--accent-cross); border-color: var(--accent-cross); color: var(--bg); }
.filter-btn[data-phase="meta"].active { background: var(--accent-meta); border-color: var(--accent-meta); color: var(--bg); }

.grid {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1.5rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.8rem;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px;
  height: 100%;
  transition: width 0.3s;
}
.card[data-phase="before"]::before { background: var(--accent-before); }
.card[data-phase="during"]::before { background: var(--accent-during); }
.card[data-phase="after"]::before { background: var(--accent-after); }
.card[data-phase="cross"]::before { background: var(--accent-cross); }
.card[data-phase="meta"]::before { background: var(--accent-meta); }
.card:hover { transform: translateY(-4px); border-color: #555; }
.card:hover::before { width: 6px; }

.card .num {
  font-family: 'Noto Serif JP', serif;
  font-weight: 900;
  font-size: 2rem;
  opacity: 0.12;
  position: absolute;
  top: 0.8rem;
  right: 1.2rem;
}
.card .phase-tag {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  padding: 0.2rem 0.6rem;
  border-radius: 1rem;
  margin-bottom: 0.8rem;
}
.card[data-phase="before"] .phase-tag { background: rgba(201,169,110,0.15); color: var(--accent-before); }
.card[data-phase="during"] .phase-tag { background: rgba(110,165,201,0.15); color: var(--accent-during); }
.card[data-phase="after"] .phase-tag { background: rgba(123,201,110,0.15); color: var(--accent-after); }
.card[data-phase="cross"] .phase-tag { background: rgba(201,110,184,0.15); color: var(--accent-cross); }
.card[data-phase="meta"] .phase-tag { background: rgba(201,110,110,0.15); color: var(--accent-meta); }

.card .name {
  font-family: 'Noto Serif JP', serif;
  font-weight: 700;
  font-size: 1.25rem;
  margin-bottom: 0.6rem;
  letter-spacing: 0.05em;
}
.card .summary {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.7;
}

/* Modal */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  max-width: 700px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 2.5rem;
  position: relative;
  animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(0.96); } }
.modal .close-btn {
  position: absolute;
  top: 1rem;
  right: 1.2rem;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
}
.modal .m-phase {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  padding: 0.25rem 0.8rem;
  border-radius: 1rem;
  margin-bottom: 1rem;
}
.modal .m-name {
  font-family: 'Noto Serif JP', serif;
  font-weight: 900;
  font-size: 1.6rem;
  margin-bottom: 1.5rem;
  letter-spacing: 0.05em;
}
.modal .section-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 1.5rem;
  margin-bottom: 0.5rem;
}
.modal .section-label.ctx { color: var(--accent-before); }
.modal .section-label.prob { color: var(--accent-meta); }
.modal .section-label.sol { color: var(--accent-after); }
.modal .section-label.social { color: var(--accent-cross); }
.modal p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.9; }

.stats {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem 2rem 4rem;
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
}
.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.2rem 1.8rem;
  text-align: center;
  min-width: 140px;
}
.stat-box .stat-num { font-family: 'Noto Serif JP'; font-weight: 900; font-size: 2rem; }
.stat-box .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.3rem; letter-spacing: 0.1em; }

footer {
  text-align: center;
  padding: 3rem 2rem;
  font-size: 0.75rem;
  color: #555;
  border-top: 1px solid var(--border);
  letter-spacing: 0.1em;
  line-height: 2;
}
footer a {
  color: var(--accent-before);
  text-decoration: none;
  border-bottom: 1px solid rgba(201,169,110,0.4);
  transition: border-color 0.2s;
}
footer a:hover { border-color: var(--accent-before); }
.source-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: rgba(201,169,110,0.1);
  border: 1px solid rgba(201,169,110,0.25);
  border-radius: 2rem;
  padding: 0.35rem 0.9rem;
  margin: 0.3rem 0.2rem;
  font-size: 0.7rem;
  color: var(--accent-before);
  text-decoration: none;
  transition: all 0.2s;
  letter-spacing: 0.05em;
}
.source-badge:hover {
  background: rgba(201,169,110,0.2);
  border-color: var(--accent-before);
  transform: translateY(-1px);
}
.footer-sources {
  margin-top: 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  justify-content: center;
}
.case-badge {
  display: inline-block;
  font-size: 0.62rem;
  font-weight: 600;
  padding: 0.2rem 0.6rem;
  border-radius: 1rem;
  background: rgba(110,165,201,0.15);
  color: var(--accent-during);
  margin-top: 0.4rem;
  letter-spacing: 0.05em;
}
.cases-list { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
.case-item {
  display: block;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.8rem 1rem;
  text-decoration: none;
  color: var(--text);
  transition: all 0.2s;
}
.case-item:hover { border-color: var(--accent-cross); transform: translateX(3px); }
.case-item-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; }
.case-item-meta { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 0.25rem; }
.case-item-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; }

.axis-switch {
  display: flex; justify-content: center; gap: 0; margin: 0 auto;
  padding: 1.4rem 2rem 0; 
}
.axis-switch .inner {
  display: inline-flex; border: 1px solid var(--border); border-radius: 2rem; padding: 0.25rem; gap: 0.25rem;
}
.axis-btn {
  font-family: 'Noto Sans JP', sans-serif; font-size: 0.78rem; font-weight: 500;
  padding: 0.35rem 1.1rem; border: none; border-radius: 2rem; background: transparent;
  color: var(--text-muted); cursor: pointer; transition: all 0.3s; letter-spacing: 0.05em;
}
.axis-btn:hover { color: var(--text); }
.axis-btn.active { background: var(--surface2); color: var(--text); }
.cycle-note {
  text-align: center; font-size: 0.72rem; color: var(--text-muted);
  padding: 0.5rem 2rem 0; letter-spacing: 0.03em;
}
.empty-state {
  grid-column: 1 / -1; text-align: center; padding: 4rem 1.5rem;
  border: 1px dashed var(--border); border-radius: 0.75rem; line-height: 2;
}
.empty-state .es-title { font-size: 1rem; color: var(--text); margin-bottom: 0.4rem; }
.empty-state .es-sub { font-size: 0.8rem; color: var(--text-muted); }
</style>
</head>
<body>

<section class="hero">
  <h1>伴走者のパターン・ランゲージ</h1>
  <p class="subtitle">越境学習の伴走者ガイドライン（経済産業省 2025）の知見を<br>パターン・ランゲージの形式で構造化した 試作版</p>
  <div class="count">38</div>
  <div class="scroll-hint">▼ SCROLL</div>
</section>

<div class="stats" id="stats"></div>

<div class="axis-switch">
  <div class="inner">
    <button class="axis-btn active" data-axis="phase">越境学習の旅</button>
    <button class="axis-btn" data-axis="cycle">支援サイクル</button>
  </div>
</div>
<div class="cycle-note" id="axisNote"></div>

<nav class="controls" id="controls"></nav>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<footer>
  パターン・ランゲージ試作版 — 井庭崇『パターン・ランゲージ』の方法論に基づき構造化
  <div class="footer-sources">
    <a class="source-badge" href="https://www.meti.go.jp/policy/economy/jinzai/shukkokigyo/gaidorain.pdf" target="_blank" rel="noopener">
      📄 原典：経済産業省 越境学習伴走者ガイドライン (2025)
    </a>
    <a class="source-badge" href="./index.html">
      ← ツール一覧に戻る
    </a>
  </div>
</footer>

<script>
// ===== データ読み込み =====
// パターン本文の正本は cross-border-patterns.json。
const DATA_URL = './cross-border-patterns.json';

const phaseLabels = {
  before: "越境前", during: "越境中", after: "越境後", cross: "フェーズ横断", meta: "伴走の構え"
};
const phaseColors = {
  before:'var(--accent-before)', during:'var(--accent-during)', after:'var(--accent-after)',
  cross:'var(--accent-cross)', meta:'var(--accent-meta)'
};
// 支援サイクルの色（既存アクセント色を流用）
const cycleColors = {
  collect:'var(--accent-before)', immerse:'var(--accent-before)',
  analyze:'var(--accent-cross)', assess_issue:'var(--accent-cross)',
  consider:'var(--accent-during)', assess_action:'var(--accent-during)',
  execute:'var(--accent-after)', followup:'var(--accent-after)',
  stance:'var(--accent-meta)', growth:'var(--accent-meta)'
};
const axisNotes = {
  phase: '原典（経済産業省ガイドライン）の軸 — 越境学習者の旅にそった分類',
  cycle: 'コーディネーターの支援サイクル（虎の巻2018）の軸 — 空白の段階はそのまま表示しています'
};

let patterns = [];
let cycleStages = [];
let cycleLabels = {};
let casesData = {};
let currentAxis = 'phase';
let currentFilter = 'all';

const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const controlsEl = document.getElementById('controls');
const axisNoteEl = document.getElementById('axisNote');

async function boot() {
  try {
    const r = await fetch(DATA_URL + '?_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    patterns = data.patterns || data;
    cycleStages = (data.cycle_stages || []).slice().sort((a,b) => a.order - b.order);
    cycleStages.forEach(s => { cycleLabels[s.id] = s.label; });
    if (!Array.isArray(patterns) || patterns.length === 0) throw new Error('empty');
  } catch (e) {
    grid.innerHTML = '<div class="empty-state"><div class="es-title">パターンデータを読み込めませんでした</div>'
      + '<div class="es-sub">cross-border-patterns.json が同じ階層にあるか確認してください。'
      + '<br>ローカルでファイルを直接開いた場合は読み込めません（簡易サーバー経由で開いてください）。</div></div>';
    return;
  }

  patterns.forEach(p => {
    if (Array.isArray(p.jp_cases) && p.jp_cases.length > 0) casesData[p.id] = p.jp_cases;
  });

  renderStats();
  setAxis('phase');
}

function labelOf(axis, key) {
  return axis === 'phase' ? (phaseLabels[key] || key) : (cycleLabels[key] || key);
}
function colorOf(axis, key) {
  const c = axis === 'phase' ? phaseColors[key] : cycleColors[key];
  return c || 'var(--text-muted)';
}
function countBy(axis) {
  const c = {};
  patterns.forEach(p => { const k = p[axis]; if (k) c[k] = (c[k]||0) + 1; });
  return c;
}

// ===== 統計（フェーズ軸で固定表示） =====
function renderStats() {
  const counts = countBy('phase');
  statsEl.innerHTML = '';
  Object.keys(phaseLabels).forEach(phase => {
    if (!counts[phase]) return;
    statsEl.innerHTML += `<div class="stat-box"><div class="stat-num" style="color:${phaseColors[phase]}">${counts[phase]}</div><div class="stat-label">${phaseLabels[phase]}</div></div>`;
  });
  const heroCount = document.querySelector('.hero .count');
  if (heroCount) heroCount.textContent = patterns.length;
}

// ===== 軸の切り替え =====
function setAxis(axis) {
  currentAxis = axis;
  axisNoteEl.textContent = axisNotes[axis];
  document.querySelectorAll('.axis-btn').forEach(b => b.classList.toggle('active', b.dataset.axis === axis));
  renderFilters();
  renderCards('all');
}

function renderFilters() {
  const counts = countBy(currentAxis);
  const keys = currentAxis === 'phase'
    ? Object.keys(phaseLabels)
    : cycleStages.map(s => s.id);

  controlsEl.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'filter-btn active';
  all.dataset.key = 'all';
  if (currentAxis === 'phase') all.dataset.phase = 'all';
  all.textContent = `すべて（${patterns.length}）`;
  controlsEl.appendChild(all);

  keys.forEach(k => {
    const n = counts[k] || 0;
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.key = k;
    if (currentAxis === 'phase') btn.dataset.phase = k;
    btn.textContent = `${labelOf(currentAxis, k)}（${n}）`;
    if (n === 0) btn.style.opacity = '0.5';
    controlsEl.appendChild(btn);
  });

  controlsEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
      controlsEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards(btn.dataset.key);
    };
  });
}

// ===== カード描画 =====
function renderCards(filter) {
  currentFilter = filter;
  grid.innerHTML = '';
  const filtered = filter === 'all' ? patterns : patterns.filter(p => p[currentAxis] === filter);

  if (filtered.length === 0) {
    const stage = cycleStages.find(s => s.id === filter);
    grid.innerHTML = `<div class="empty-state">
      <div class="es-title">${labelOf(currentAxis, filter)} — まだカードがありません</div>
      <div class="es-sub">${stage && stage.note ? stage.note + '<br>' : ''}この段階の知恵は、虎の巻や勉強会に素材があります。ここを埋めるのが次の一手です。</div>
    </div>`;
    return;
  }

  filtered.forEach((p, i) => {
    const cases = casesData[p.id] || [];
    const key = p[currentAxis];
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.phase = p.phase;
    card.style.animationDelay = `${i * 0.04}s`;
    const tagStyle = currentAxis === 'cycle'
      ? ` style="background:${colorOf('cycle', key)}22;color:${colorOf('cycle', key)}"` : '';
    card.innerHTML = `
      <div class="num">${String(p.id).padStart(2,'0')}</div>
      <span class="phase-tag"${tagStyle}>${labelOf(currentAxis, key)}</span>
      <div class="name">${p.name}</div>
      <div class="summary">${p.summary}</div>
      ${cases.length > 0 ? `<div class="case-badge">事例 ${cases.length}件</div>` : ''}
    `;
    card.onclick = () => openModal(p);
    grid.appendChild(card);
  });
}

document.querySelectorAll('.axis-btn').forEach(b => {
  b.onclick = () => setAxis(b.dataset.axis);
});

// ===== モーダル =====
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
function openModal(p) {
  const color = phaseColors[p.phase] || 'var(--text)';
  const cyColor = colorOf('cycle', p.cycle);
  const cases = casesData[p.id] || [];

  const casesHtml = cases.length > 0 ? `
    <div class="section-label" style="color:var(--accent-cross);margin-top:1.5rem">事例 — Cases（${cases.length}件）</div>
    <div class="cases-list">
      ${cases.map((c, i) => `
        <a class="case-item" href="./cases.html?collection=cross-border&patternId=${p.id}&caseIndex=${i}" target="_blank">
          <div class="case-item-title">${c.title}</div>
          <div class="case-item-meta">${c.date || ''}${c.author ? ' / ' + c.author : ''}</div>
          <div class="case-item-desc">${(c.desc||'').slice(0,80)}${(c.desc||'').length > 80 ? '...' : ''}</div>
        </a>
      `).join('')}
    </div>
  ` : '';

  const resultHtml = p.result ? `
    <div class="section-label sol">結果 — Result</div>
    <p>${p.result}</p>` : '';

  const cycleTag = p.cycle ? `<span class="m-phase" style="background:${cyColor}22;color:${cyColor};margin-left:0.4rem">${cycleLabels[p.cycle] || p.cycle}</span>` : '';

  const related = Array.isArray(p.related) && p.related.length
    ? `<div class="section-label" style="color:var(--text-muted);margin-top:1.5rem">関連するパターン</div>
       <p>${p.related.map(id => {
            const t = patterns.find(x => x.id === id);
            return t ? `#${String(id).padStart(2,'0')} ${t.name}` : `#${id}`;
          }).join(' ／ ')}</p>` : '';

  modal.innerHTML = `
    <button class="close-btn" onclick="closeModal()">✕</button>
    <span class="m-phase" style="background:${color}22;color:${color}">${phaseLabels[p.phase] || p.phase} #${String(p.id).padStart(2,'0')}</span>
    ${cycleTag}
    <div class="m-name">${p.name}</div>
    <div class="section-label ctx">状況 — Context</div>
    <p>${p.context}</p>
    <div class="section-label prob">問題 — Problem</div>
    <p>${p.problem}</p>
    <div class="section-label sol">解決 — Solution</div>
    <p>${p.solution}</p>
    ${resultHtml}
    <div class="section-label social">社会起業家支援への読み替え</div>
    <p>${p.social}</p>
    ${related}
    ${casesHtml}
  `;
  overlay.classList.add('open');
}
function closeModal() { overlay.classList.remove('open'); }
overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

boot();
</script>
</body>
</html>
